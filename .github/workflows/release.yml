# DibaVault — Release build & publish (dibachain)
#
# On a version tag push (v*), build the firmware for all three targets in the
# official ESP-IDF container, inject the version from the tag, collect the
# per-target binaries plus a generated flashing guide, and publish a GitHub
# Release with everything attached.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.3
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3, esp32c3]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true   # non-recursive: we only need crypto/, not trezor-firmware nested submodules

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py -DDIBAVAULT_VERSION="${{ steps.ver.outputs.version }}" build

      - name: Stage artifacts
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          OUT="dist/${TARGET}"
          mkdir -p "$OUT"
          cp build/bootloader/bootloader.bin           "$OUT/bootloader.bin"
          cp build/partition_table/partition-table.bin "$OUT/partition-table.bin"
          cp build/dibavault.bin                        "$OUT/dibavault.bin"

          # Bootloader offset differs by chip: 0x1000 on the classic ESP32, 0x0 on S3/C3.
          case "$TARGET" in
            esp32)   BOOT_OFFSET="0x1000" ;;
            *)       BOOT_OFFSET="0x0"    ;;
          esac

          cat > "$OUT/FLASHING.txt" <<EOF
          DibaVault ${VERSION} — flashing instructions for ${TARGET}
          (c) dibachain — GPL-3.0

          Requirements:
            pip install esptool

          Flash (replace /dev/ttyUSB0 with your serial port):

            esptool.py -p /dev/ttyUSB0 -b 460800 --chip ${TARGET} write_flash \\
              ${BOOT_OFFSET}   bootloader.bin \\
              0x8000  partition-table.bin \\
              0x20000 dibavault.bin

          To erase a device first (WARNING: destroys any stored seed — back up
          your recovery words first):

            esptool.py -p /dev/ttyUSB0 erase_flash

          First boot: open the serial console at 115200 baud, or join the device
          WiFi hotspot and browse to http://192.168.4.1 to set your PIN, choose
          your hardware, and write down your recovery words.
          EOF

          # Give each file a target-qualified name for the release assets.
          ( cd "$OUT" && for f in *; do mv "$f" "dibavault-${VERSION}-${TARGET}-$f"; done )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dibavault-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all target artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DibaVault ${{ github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            **DibaVault ${{ github.ref_name }}** — by dibachain (GPL-3.0)

            Firmware binaries for **esp32**, **esp32s3** and **esp32c3**. Each target
            ships `bootloader.bin`, `partition-table.bin`, `dibavault.bin` and a
            per-target `FLASHING.txt`.

            > DibaVault is experimental and **not independently audited**, and the
            > ESP32 has **no dedicated secure element**. Test on testnets first and
            > read the security notes before storing real funds:
            > https://github.com/dibachain/esp32-hdwallet/blob/main/docs/SECURITY.md
